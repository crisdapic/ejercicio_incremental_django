<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda</title>
</head>
<body>

    <nav>
        <a href="{% url 'home' %}">Inicio</a>

        {% if user.is_authenticated %}

            <a href="{% url 'categoria_lista' %}">
                Categorías
            </a>

            <a href="{% url 'producto_lista' %}">
                Productos
            </a>

            <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Cerrar sesión</button>
            </form>

        {% else %}

            <a href="{% url 'login' %}">
                Iniciar sesión
            </a>

            <a href="{% url 'register' %}">
                Registrarse
            </a>

        {% endif %}
    </nav>

    <hr>

    {% block content %}
    {% endblock %}

</body>
</html>
