{% extends "base.html" %}

{% block content %}

<h1>Iniciar sesión</h1>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Iniciar sesión</button>
</form>

<p>
    ¿No tienes una cuenta?
    <a href="{% url 'register' %}">Regístrate</a>
</p>

<p>
    <a href="{% url 'password_reset' %}">
        ¿Olvidaste tu contraseña?
    </a>
</p>

{% endblock %}
